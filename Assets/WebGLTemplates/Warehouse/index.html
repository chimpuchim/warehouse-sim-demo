<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0e14; overflow: hidden; font-family: "Trebuchet MS", system-ui, sans-serif; }
    #unity-container { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #unity-canvas { width: 100%; height: 100%; background: #0b0e14; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; color: #f4f5f7; background: #0b0e14; transition: opacity .4s; }
    #loader h1 { margin: 0; font-size: 36px; letter-spacing: .25em; font-weight: 700; color: #f9c22e; }
    #loader p { margin: 0; font-size: 14px; letter-spacing: .15em; color: #8a93a6; text-transform: uppercase; }
    #bar { width: 320px; height: 3px; background: rgba(255,255,255,.08); }
    #fill { width: 0; height: 100%; background: #f9c22e; transition: width .2s; }
    #unity-warning { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); color: #e5484d; font-size: 13px; }
    #unity-warning div { margin: 4px; padding: 6px 12px; background: #1a2030; border: 1px solid #e5484d; border-radius: 6px; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>
  <div id="loader">
    <h1>WAREHOUSE SIM DEMO</h1>
    <p>Loading the warehouse</p>
    <div id="bar"><div id="fill"></div></div>
  </div>
  <div id="unity-warning"></div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loader = document.querySelector("#loader");
    var fill = document.querySelector("#fill");
    var warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      var div = document.createElement("div");
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == "error") div.style.borderColor = "#e5484d";
      else setTimeout(function () { warningBanner.removeChild(div); }, 5000);
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      showBanner: unityShowBanner,
    };
    config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        fill.style.width = (100 * progress) + "%";
      }).then(function (unityInstance) {
        window.unityInstance = unityInstance; // used by the file-open helper and developer mode
        loader.style.opacity = 0;
        setTimeout(function () { loader.style.display = "none"; }, 400);
      }).catch(function (message) {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
